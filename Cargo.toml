[package]
name = "pcsweep"
version = "1.7.0"
edition = "2021"
description = "Fast, safe disk cleanup and PC health tool for Windows 11"
repository = "https://github.com/kashrtx/pcsweep"
build = "build.rs"
license = "Apache-2.0"
authors = ["Kaushal Bhingaradia"]

[[bin]]
name = "PCSweep"
path = "src/main.rs"

[dependencies]
# GUI: keep the 0.29 API; Cargo.lock pins the complete application build.
eframe = "0.29"
raw-window-handle = "0.6"
# System info: memory, CPU, processes, drives
sysinfo = "~0.30"
# Windows registry (startup apps, installed apps, known folders)
winreg = "0.52"
# Recycle Bin size/empty + admin check
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Power", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Services", "Win32_Graphics_Gdi", "Win32_System_Com"] }
# Parallel scanning
rayon = "1.10"
# Native folder picker
rfd = "0.15"
# Move user files to the Recycle Bin (reversible)
trash = "5"
# Fast hashing for duplicate detection
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# Local time formatting
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
semver = "1"
base64 = "0.22"
tungstenite = { version = "0.28", features = ["native-tls"] }
ureq = { version = "2.12", default-features = false, features = ["native-tls", "json"] }

[build-dependencies]
# Embeds the icon and version info into the .exe
winresource = "0.1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
