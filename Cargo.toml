[package]
name = "pcsweep"
version = "1.1.0"
edition = "2021"
description = "Fast, safe disk cleanup and PC health tool for Windows 11"
repository = "https://github.com/kashrtx/pcsweep"
build = "build.rs"
license = "MIT"

[[bin]]
name = "PCSweep"
path = "src/main.rs"

[dependencies]
# GUI: keep the 0.29 API; Cargo.lock pins the complete application build.
eframe = "0.29"
# System info: memory, CPU, processes, drives
sysinfo = "~0.30"
# Windows registry (startup apps, installed apps, known folders)
winreg = "0.52"
# Recycle Bin size/empty + admin check
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_Globalization", "Win32_Storage_FileSystem"] }
# Parallel scanning
rayon = "1.10"
# Native folder picker
rfd = "0.15"
# Move user files to the Recycle Bin (reversible)
trash = "5"
# Fast hashing for duplicate detection
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# Local time formatting
chrono = "0.4"

[build-dependencies]
# Embeds the icon and version info into the .exe
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
