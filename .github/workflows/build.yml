name: Build and release PCSweep

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

# A branch-wide group would discard pending pushes during a burst. Only duplicate
# runs of the same commit share a group, so every main push can release.
concurrency:
  group: pcsweep-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Test and build Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Test release automation
        run: python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Test application
        run: cargo test --locked

      - name: Smoke test the public speed endpoints
        timeout-minutes: 1
        continue-on-error: true
        run: cargo test --locked speed::tests::cloudflare_https_smoke -- --ignored --exact

      - name: Save UI previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: PCSweep-UI-previews
          path: target/ui-previews/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build release
        run: cargo build --release --locked

      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read Cargo metadata' }
          $v = ($metadata.packages | Where-Object name -eq 'pcsweep').version
          if (-not $v) { throw 'PCSweep package version is missing' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Package portable application
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist, pkg | Out-Null
          Copy-Item target/release/PCSweep.exe dist/PCSweep.exe
          Copy-Item LICENSE, NOTICE dist/
          Copy-Item target/release/PCSweep.exe, README.md, LICENSE, NOTICE, PRIVACY.md, RELEASE_NOTES.md, UNINSTALLER_RESEARCH.md pkg/
          Compress-Archive -Path pkg/* -DestinationPath "dist/PCSweep-$env:APP_VERSION-windows-x64.zip" -Force
          Get-ChildItem dist -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS.txt

      - name: Upload tested build
        uses: actions/upload-artifact@v7
        with:
          name: PCSweep-windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish automatic release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release automation
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download tested build
        uses: actions/download-artifact@v8
        with:
          name: PCSweep-windows-x64
          path: dist

      - name: Publish executable, portable ZIP and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        run: python scripts/publish_release.py --version "$APP_VERSION"
